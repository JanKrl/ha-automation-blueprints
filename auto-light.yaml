blueprint:
  name: Auto-adaptive light
  description: "Motion triggered light. Enables 'dim before off' to notify that the light will turn off soon. To be used on lights controlled by Adaptive Lighting addon. IMPORTANT! Requres Adaptive Lighting config include_config_in_attributes to be enabled."
  domain: automation
  input:
    motion_sensor:
      name: Motion sensor
      description: Motion / Occupancy sensor in the area
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: motion
            - domain: binary_sensor
              device_class: occupancy
    adaptive_lights:
      name: Adaptive light
      description: Adaptive lighting integration that controlls selected lights
      selector:
        device:
          multiple: true
          filter:
            - integration: adaptive_lighting
    time_delay_normal:
      name: Time delay (normal)
      description: Seconds to wait after motion stops before dimming and turning off
      default: 30
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds

triggers:
  - trigger: state
    entity_id: !input motion_sensor
    from: null
    to: "on"

actions:
  - variables:
      adaptive_lights: !input adaptive_lights
      switch_entities: >
        {% set ns = namespace(entities=[]) %}
        {% set devices = [adaptive_lights] if adaptive_lights is string else (adaptive_lights | default([])) %}
        {% for item in devices %}
          {% set entity = device_entities(item)
              | select('match', 'switch.adaptive_lighting_')
              | reject('match', 'switch.adaptive_lighting_adapt_')
              | reject('match', 'switch.adaptive_lighting_sleep_mode_')
              | first | default('') %}
          {% if entity %}
            {% set ns.entities = ns.entities + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.entities }}
      target_lights: >
        {% set ns = namespace(lights=[]) %}
        {% for sw in switch_entities %}
          {% set cfg = state_attr(sw, 'configuration') %}
          {% if cfg and cfg.get('lights') %}
            {% set ns.lights = ns.lights + cfg['lights'] %}
          {% endif %}
        {% endfor %}
        {{ ns.lights | unique | list }}

  - action: adaptive_lighting.set_manual_control
    data:
      manual_control: false
      entity_id: "{{ switch_entities }}"
    enabled: true

  - action: light.turn_on
    target:
      entity_id: "{{ target_lights }}"

  - alias: Wait until there is no motion from device
    wait_for_trigger:
      - trigger: state
        entity_id: !input motion_sensor
        from: "on"
        to: "off"
        for:
          seconds: !input time_delay_normal
    continue_on_timeout: false

  - variables:
      dimmed_brightness: >
        {% set first_sw = switch_entities | first | default('') %}
        {{ (state_attr(first_sw, 'brightness_pct') | float(100) / 3) | int }}

  - action: light.turn_on
    data:
      brightness_pct: "{{ dimmed_brightness }}"
      transition: 1
    target:
      entity_id: "{{ target_lights }}"
    enabled: true

  - delay:
      seconds: 5
    enabled: true

  - action: light.turn_off
    target:
      entity_id: "{{ target_lights }}"

mode: restart
max_exceeded: silent
